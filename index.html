<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altiva Láser</title>
    <link rel="icon" type="image/png" href="icon.png">  
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #8F4314;
            --primary-hover: #6E320D;
            --bg-light: #FEF5EC;
            --text-dark: #3D2D24;
            --shadow: 0 4px 20px rgba(143, 67, 20, 0.08);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding-top: 80px; 
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* Barra de Navegación */
        .navbar {
            background: rgba(254, 245, 236, 0.95);
            backdrop-filter: blur(8px);
            padding: 1rem 3rem;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 1.5px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: 0.3s;
            cursor: pointer;
            padding: 5px 10px;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Contenedor Principal */
        .container {
            max-width: 1100px;
            margin: 30px auto 50px;
            padding: 0 20px;
        }

        /* Banner Principal estilo Boho */
        .hero-main {
            text-align: center;
            padding: 90px 30px;
            background-color: #F7ECE1;
            /* Reemplaza 'fondo-boho.jpg' con el nombre de tu archivo de imagen */
            background-image: linear-gradient(rgba(254, 245, 236, 0.70), rgba(254, 245, 236, 0.70)), url('fondo-boho.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero-logo-icon {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .hero-title {
            font-size: 2.2rem;
            color: var(--text-dark);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-description {
            max-width: 600px;
            font-size: 1rem;
            line-height: 1.6;
            color: #5A493E;
            margin-bottom: 30px;
        }

        /* Botón principal */
        .btn {
            padding: 14px 34px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            letter-spacing: 1px;
        }

        .btn-primary { 
            background: var(--primary); 
            color: white; 
        }

        .btn-primary:hover { 
            background: var(--primary-hover); 
            transform: translateY(-2px); 
            box-shadow: 0 6px 18px rgba(143, 67, 20, 0.25);
        }

        /* Manejo de Pestañas */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }


        /* Sección de Contacto */
.contact-container {
    max-width: 650px;
    margin: 0 auto;
    background: white;
    padding: 50px 40px;
    border-radius: 20px;
    box-shadow: var(--shadow);
    text-align: center;
}

.contact-title {
    font-size: 1.8rem;
    color: var(--primary);
    margin-bottom: 10px;
}

.contact-subtitle {
    color: #666;
    margin-bottom: 30px;
    font-size: 0.95rem;
}

.contact-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.btn-whatsapp {
    background: #25D366;
    color: white;
    justify-content: center;
}
.btn-whatsapp:hover {
    background: #1EBE5D;
    transform: translateY(-2px);
}

.btn-instagram {
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    color: white;
    justify-content: center;
}
.btn-instagram:hover {
    opacity: 0.9;
    transform: translateY(-2px);
}
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-r.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar">
        <a href="#" class="logo">ALTIVA LÁSER</a>
        <div class="nav-links">
            <a onclick="showTab('inicio')">Inicio</a>
            <a onclick="showTab('proyectos')">Catálogo</a>
            <a onclick="showTab('contacto')">Contacto</a>
        </div>
    </nav>
    
    <main class="container">
        <div id="inicio" class="tab-content active">
            <section class="hero-main">
                <img src="icon.png" alt="Logo Altiva Láser" class="hero-logo-icon">
                
                <h1 class="hero-title">Bienvenidos a Altiva Láser</h1>
                <h2 class="hero-subtitle">- Le damos forma a tus ideas -</h2>
                
                <p class="hero-description">
                    aca dejamos el texto sobre la empresa
                </p>

                <button class="btn btn-primary" onclick="showTab('proyectos')">VER CATÁLOGO</button>
            </section>
        </div>
        <div id="proyectos" class="tab-content">
        </div>
        <div id="contacto" class="tab-content">
        </div>

    </main>

    <script>
    function showTab(tabId) {
        const tabs = document.querySelectorAll('.tab-content');
        tabs.forEach(tab => tab.classList.remove('active'));

        const selectedTab = document.getElementById(tabId);
        if (selectedTab) {
            selectedTab.classList.add('active');
        }
    }
</script>

</body>
</html>
